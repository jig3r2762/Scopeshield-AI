<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScopeShield Analysis</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-container">
    <!-- Header -->
    <header class="panel-header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>ScopeShield AI</span>
      </div>
      <button id="refresh-btn" class="btn-icon" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </header>

    <!-- Not Authenticated State -->
    <div id="not-auth-section" class="section hidden">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h3>Not Connected</h3>
        <p>Click the extension icon to connect your account.</p>
      </div>
    </div>

    <!-- No Analysis State -->
    <div id="no-analysis-section" class="section">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h3>Ready to Analyze</h3>
        <p>Open an email and click <strong>Check Scope</strong> to detect scope creep.</p>
      </div>
    </div>

    <!-- Analysis Results -->
    <div id="analysis-section" class="section hidden">

      <!-- Risk Badge -->
      <div id="risk-badge" class="risk-badge risk-low">
        <div class="risk-icon-wrap">
          <!-- Icon injected by JS -->
        </div>
        <div class="risk-info">
          <span class="risk-label">Within Scope</span>
          <span class="risk-confidence">85% confidence</span>
        </div>
      </div>

      <!-- Analysis Card -->
      <div class="card">
        <div class="card-label">Analysis</div>
        <p id="analysis-reasoning" class="card-body">Loading...</p>
      </div>

      <!-- Reply Suggestions -->
      <div id="replies-section" class="hidden">
        <div class="card-label" style="margin-bottom: 8px;">Suggested Replies</div>
        <div id="replies-container" class="replies-container"></div>
      </div>

      <!-- Project Link -->
      <div id="project-link-section" class="card">
        <div class="card-label">Link to Project</div>
        <select id="project-select" class="select">
          <option value="">Select a project...</option>
        </select>
        <button id="link-project-btn" class="btn btn-sm" style="margin-top:8px; width:100%;">Link &amp; Re-analyze</button>
      </div>

      <!-- Timestamp -->
      <div class="analysis-meta">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="analysis-time">Just now</span>
      </div>
    </div>

    <!-- History Section -->
    <div id="history-section" class="section history-section">
      <div class="section-label">Recent Analyses</div>
      <div id="history-list" class="history-list">
        <p class="empty-history">No recent analyses</p>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
